name: Antigravity
options:
  bundleIdPrefix: com.smoze
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  Antigravity:
    type: application
    platform: iOS
    sources:
      - path: Antigravity
      - path: Antigravity/AppIcons/Antigravity.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoze.antigravity
        INFOPLIST_FILE: Antigravity/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Antigravity"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "2000"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
