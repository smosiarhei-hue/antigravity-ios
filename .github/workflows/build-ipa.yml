# Path: .github/workflows/build-ipa.yml
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version
        run: |
          RUN=${{ github.run_number }}
          echo "MARKETING_VERSION=1.0.$RUN" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$RUN" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=com.smoze.antigravity" >> "$GITHUB_ENV"

      - name: Check for Apple Certificate Secrets
        id: cert_check
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROV_BASE64" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets detected. Code signing ENABLED."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets missing. Building unsigned."
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_FILE="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_FILE"

          security import "$CERT_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -1 | grep -o '".*"' | sed 's/"//g')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          PROV_FILE="$RUNNER_TEMP/embedded.mobileprovision"
          echo "$PROV_BASE64" | base64 --decode > "$PROV_FILE"

          BUNDLE_ID=$(python3 -c '
import plistlib, sys
with open(sys.argv[1], "rb") as f:
    p = plistlib.load(f)
ent = p.get("Entitlements", {})
appid = ent.get("application-identifier", "")
print(appid.split(".", 1)[1] if "." in appid else appid)
' "$PROV_FILE" 2>/dev/null || true)

          TEAM_ID=$(python3 -c '
import plistlib, sys
with open(sys.argv[1], "rb") as f:
    p = plistlib.load(f)
team = p.get("TeamIdentifier", [""])[0]
print(team)
' "$PROV_FILE" 2>/dev/null || true)

          UUID=$(python3 -c '
import plistlib, sys
with open(sys.argv[1], "rb") as f:
    p = plistlib.load(f)
print(p.get("UUID", ""))
' "$PROV_FILE" 2>/dev/null || true)

          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROV_FILE=$PROV_FILE" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          python3 .github/scripts/patch_project_signing.py "$BUNDLE_ID" "$TEAM_ID" "$SIGNING_IDENTITY" "$UUID" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Building and signing with developer certificate..."
            xcodebuild \
              -project Antigravity.xcodeproj \
              -scheme Antigravity \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
              OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
              build 2>&1 | tee build.log
          else
            echo "==> Building unsigned..."
            xcodebuild \
              -project Antigravity.xcodeproj \
              -scheme Antigravity \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee build.log
          fi

      - name: Package IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          echo "Found app: $APP"

          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Embedding provisioning profile into app bundle..."
            cp "$PROV_FILE" "$APP/embedded.mobileprovision"

            security cms -D -i "$PROV_FILE" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "==> Signing app bundle with entitlements..."
            codesign --force --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --timestamp=none \
              --generate-entitlement-der \
              "$APP"

            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Antigravity.ipa Payload
            cp Antigravity.ipa Antigravity-unsigned.ipa
            echo "IPA_IS_SIGNED=true" >> "$GITHUB_ENV"
            echo "SUCCESS: Signed IPA packaged."
          else
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Antigravity-unsigned.ipa Payload
            cp Antigravity-unsigned.ipa Antigravity.ipa
            echo "IPA_IS_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-ipa
          path: |
            Antigravity.ipa
            Antigravity-unsigned.ipa
          if-no-files-found: error

      - name: Deploy OTA to GitHub Pages
        id: ota
        if: env.HAS_SIGNING == 'true'
        env:
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
        run: python3 .github/scripts/deploy_ota_pages.py

      - name: Send IPA to Telegram bot
        if: always() && hashFiles('Antigravity.ipa') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8559869613' }}
          IPA_IS_SIGNED: ${{ env.IPA_IS_SIGNED }}
          OTA_PUBLISHED: ${{ steps.ota.outcome == 'success' }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: python3 .github/scripts/send_ipa_telegram.py

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Antigravity.ipa
            Antigravity-unsigned.ipa
          generate_release_notes: true
