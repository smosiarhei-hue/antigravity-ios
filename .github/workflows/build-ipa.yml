name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Compute version
        run: |
          RUN=${{ github.run_number }}
          echo "MARKETING_VERSION=2.1.$RUN" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((2100 + RUN))" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=app.hare5681.lyra4838" >> "$GITHUB_ENV"

      - name: Check for Apple Certificate Secrets
        id: cert_check
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROV_BASE64" ]; then
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets detected. Code signing ENABLED."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "Apple Certificate secrets missing. Building unsigned."
          fi

      - name: Install Apple Certificate and Provisioning Profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CLEAN_PASS=$(echo -n "$P12_PASSWORD" | tr -d '\r\n')
          CERT_FILE="$RUNNER_TEMP/cert.p12"
          echo -n "$P12_BASE64" | tr -d '\r\n' | base64 --decode > "$CERT_FILE"

          if ! security import "$CERT_FILE" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security 2>/dev/null; then
            echo "Direct PKCS12 import failed. Converting to Apple-compatible format..."
            OPENSSL_BIN=$(which openssl || echo "/usr/bin/openssl")
            for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl /opt/homebrew/bin/openssl; do
              if [ -x "$candidate" ]; then
                OPENSSL_BIN="$candidate"
                break
              fi
            done
            "$OPENSSL_BIN" pkcs12 -in "$CERT_FILE" -passin "pass:$CLEAN_PASS" -nodes -out "$RUNNER_TEMP/cert.pem"
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert-legacy.p12" -passout "pass:$CLEAN_PASS" -legacy 2>/dev/null || \
            "$OPENSSL_BIN" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert-legacy.p12" -passout "pass:$CLEAN_PASS"
            security import "$RUNNER_TEMP/cert-legacy.p12" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -T /usr/bin/codesign -T /usr/bin/security
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="iPhone Distribution"
          fi

          PROV_FILE="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROV_BASE64" | tr -d '\r\n' | base64 --decode > "$PROV_FILE"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          PLIST_CONTENT=$(security cms -D -i "$PROV_FILE")
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$PLIST_CONTENT")
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$PLIST_CONTENT")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" /dev/stdin <<< "$PLIST_CONTENT")
          BUNDLE_ID="${APP_ID#${TEAM_ID}.}"

          cp "$PROV_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          echo "Configured Profile: UUID=$UUID, Team=$TEAM_ID, Bundle=$BUNDLE_ID"
          echo "Discovered Signing Identity: $SIGNING_IDENTITY"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROV_FILE=$PROV_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          python3 .github/scripts/patch_project_signing.py "$BUNDLE_ID" "$TEAM_ID" "$SIGNING_IDENTITY" "$UUID" project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        id: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Building and signing with developer certificate..."
            xcodebuild \
              -project Antigravity.xcodeproj \
              -scheme Antigravity \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="${TEAM_ID}" \
              PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
              CODE_SIGN_IDENTITY="${SIGNING_IDENTITY}" \
              OTHER_CODE_SIGN_FLAGS="--keychain ${KEYCHAIN_PATH}" \
              build 2>&1 | tee build.log
          else
            echo "==> Building unsigned..."
            xcodebuild \
              -project Antigravity.xcodeproj \
              -scheme Antigravity \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGN_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build 2>&1 | tee build.log
          fi

      - name: Package IPA
        run: |
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP"
          echo "Found app: $APP"

          if [ "$HAS_SIGNING" = "true" ]; then
            echo "==> Embedding provisioning profile into app bundle..."
            cp "$PROV_FILE" "$APP/embedded.mobileprovision"

            security cms -D -i "$PROV_FILE" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"

            echo "==> Ensuring Info.plist has CFBundleDisplayName and correct versions..."
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ZeroG" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ZeroG" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleName ZeroG" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string ZeroG" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$APP/Info.plist" || true

            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            echo "==> Signing app bundle with entitlements..."
            codesign --force --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --timestamp=none \
              --generate-entitlement-der \
              "$APP"

            echo "==> Verifying signature:"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dvvv "$APP"

            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Antigravity.ipa Payload
            cp Antigravity.ipa Antigravity-unsigned.ipa
            echo "IPA_IS_SIGNED=true" >> "$GITHUB_ENV"
            echo "SUCCESS: Signed IPA packaged."
          else
            mkdir -p Payload
            cp -R "$APP" Payload/
            zip -qry Antigravity-unsigned.ipa Payload
            cp Antigravity-unsigned.ipa Antigravity.ipa
            echo "IPA_IS_SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-ipa
          path: |
            Antigravity.ipa
            Antigravity-unsigned.ipa
          if-no-files-found: error

      - name: Deploy OTA to GitHub Pages
        id: ota
        if: env.HAS_SIGNING == 'true'
        env:
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: python3 .github/scripts/deploy_ota_pages.py

      - name: Send IPA or installation link to configured Telegram chat
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8325367009:AAEU-zJOUqpmo_fEqSeoU7OjYq5uRHgzyfM' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8559869613' }}
          IPA_IS_SIGNED: ${{ env.IPA_IS_SIGNED }}
          OTA_PUBLISHED: ${{ steps.ota.outcome == 'success' }}
          MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: |
          if [ -f Antigravity.ipa ] || [ -f Antigravity-unsigned.ipa ]; then
            python3 .github/scripts/send_ipa_telegram.py
          else
            echo "No IPA generated, skipping Telegram delivery."
          fi

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Antigravity.ipa
            Antigravity-unsigned.ipa
          generate_release_notes: true
